hi<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MMA Royal Gallery</title>

<link rel="stylesheet" href="style.css">

<style>

.gallery-title{
font-size:3rem;
color:#ffd86a;
margin:40px 0;
text-shadow:0 0 20px gold;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:35px;
padding:30px;
max-width:1400px;
margin:auto;
}

.artwork{
background:#17325c;
border:4px solid gold;
border-radius:25px;
overflow:hidden;
transition:.35s;
box-shadow:0 0 20px rgba(255,215,0,.25);
}

.artwork:hover{
transform:translateY(-10px) scale(1.03);
box-shadow:0 0 35px gold;
}

.artwork img{
width:100%;
display:block;
}

.info{
padding:20px;
}

.artist{
font-size:1.3rem;
color:#ffd86a;
}

.desc{
color:#ddd;
margin-top:10px;
}

.back{
display:inline-block;
margin:50px;
padding:18px 40px;
background:gold;
color:#111;
text-decoration:none;
border-radius:60px;
font-weight:bold;
font-size:1.2rem;
}

</style>

</head>

<body>

<h1 class="gallery-title">
👑 Royal Anniversary Exhibition 👑
</h1>

<div class="gallery">

<div class="artwork">
    <img src="IMG_6894.jpeg" alt="Together We Stand">
    <div class="info">
        <h3>👤 WhiteMad</h3>
        <p>🏆 Together We Stand</p>
    </div>
</div>

<div class="artwork">
<img src="https://placehold.co/700x900/png?text=Artwork+2">
<div class="info">
<div class="artist">Artist Name</div>
<div class="desc">The masterpiece description goes here.</div>
</div>
</div>

<div class="artwork">
<img src="https://placehold.co/700x900/png?text=Artwork+3">
<div class="info">
<div class="artist">Artist Name</div>
<div class="desc">The masterpiece description goes here.</div>
</div>
</div>

</div>

<a class="back" href="index.html">
⬅ Return to the Castle
</a>

</body>
</html>
