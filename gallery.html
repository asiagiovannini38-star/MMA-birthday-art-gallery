<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMA Royal Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sparkles" aria-hidden="true"></div>

<header class="gallery-header">
  <a class="back-link" href="index.html">← Castle</a>
  <div class="eyebrow">QUEEN BONITA PRESENTS</div>
  <h1>👑 Royal Anniversary Gallery</h1>
  <p>17 masterpieces • 17 heroes • One Mad Monkey Army</p>
</header>

<main>
  <section class="gallery-intro">
    <h2>The Exhibition Hall</h2>
    <p>Tap any masterpiece to view it in full size.</p>
  </section>

  <section id="gallery" class="gallery" aria-label="Anniversary artwork">
  </section>
</main>

<div id="viewer" class="viewer" aria-hidden="true">
  <button class="viewer-close" aria-label="Close">×</button>
  <button class="viewer-prev" aria-label="Previous">‹</button>
  <div class="viewer-content">
    <img id="viewer-image" src="" alt="">
    <h2 id="viewer-name"></h2>
    <p id="viewer-number"></p>
  </div>
  <button class="viewer-next" aria-label="Next">›</button>
</div>

<footer>
  <a href="index.html">🏰 Return to the Kingdom</a>
  <span> • </span>
  <span>Long live MMA 🐵👑</span>
</footer>

<script src="script.js"></script>
</body>
</html>
